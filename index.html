<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/13067/13067247.png" type="image/png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: '#131314',
                        surface: '#1E1F20',
                        surface2: '#2D2E30',
                        primary: '#8AB4F8',
                        text: '#E3E3E3',
                        textDim: '#9AA0A6',

    <style>
        body { background-color: #131314; color: #E3E3E3; font-family: 'Segoe UI', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1E1F20; }
        ::-webkit-scrollbar-thumb { background: #3C4043; border-radius: 3px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .loader {
            border: 2px solid transparent; border-top: 2px solid currentColor; border-radius: 50%;
            width: 14px; height: 14px; animation: spin 0.8s linear infinite; display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .sheet-input {
            background: transparent; border: none; color: #E3E3E3; width: 100%; outline: none; text-align: center;
            font-family: monospace; font-size: 15px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; height: 100%;
        }
        .sheet-input:focus { background: #2D2E30; }
        
        .grid-table {
            display: grid; gap: 1px;
            grid-template-columns: 35px 140px 140px 120px 80px 30px; 
            min-width: 900px;
        }
        @media (min-width: 768px) {
            .grid-table { 
                grid-template-columns: 40px 1fr 1fr 1fr 100px 30px; 
                min-width: 100%;
            }
        }

        .grid-cell { 
            background: #1E1F20; padding: 0 4px;
            height: 40px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; 
        }
        .grid-header { background: #2D2E30; font-weight: bold; color: #8AB4F8; font-size: 0.8rem; }
        .col-hidden { display: none; }

        .fab-btn {
            position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 50%;
            background: #8AB4F8; color: #000; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 24px; z-index: 50; transition: transform 0.2s;
        }
        .fab-btn:active { transform: scale(0.9); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <script>
        // API Configuration (js সহ ইউনিফাইড)
        const API_BASE = 'https://mtroom-server.koyeb.app/app/rebpbs-new.js';
        const STATUS_URL = 'https://mtroom-server.koyeb.app/api/status/';

        const manufacturers = [
            {id:'41', name:'Hexing Inc.'}, {id:'61', name:'Power Plus'}, {id:'64', name:'Echo'},
            {id:'81', name:'Holley'}, {id:'141', name:'B and T'}, {id:'161', name:'TECHNO'},
            {id:'201', name:'D Tech'}, {id:'241', name:'Cell Meter'}, {id:'261', name:'Hexcell'},
            {id:'281', name:'Kaifa'}, {id:'301', name:'HOSAF'}, {id:'321', name:'PASHA'},
            {id:'341', name:'Wasion'}, {id:'361', name:'Jiangsu Linyang'}, {id:'381', name:'HAY'},
            {id:'382', name:'GAUSS'}, {id:'401', name:'ZHEJIANG'}, {id:'402', name:'FUJI'},
            {id:'403', name:'RELIANCE'}, {id:'421', name:'Libra'}, {id:'441', name:'Clou'},
            {id:'461', name:'Super Star'}, {id:'481', name:'Modern'}, {id:'482', name:'Navana'},
            {id:'483', name:'Star'}, {id:'484', name:'Eastern'}, {id:'485', name:'Citizen'},
            {id:'486', name:'Northern'}, {id:'487', name:'Prime'}, {id:'488', name:'Capital'},
            {id:'489', name:'FGF'}, {id:'490', name:'SFS'}, {id:'491', name:'Electro'},
            {id:'501', name:'BPEMC'}, {id:'521', name:'Hangzhou'}, {id:'522', name:'Suzhou'},
            {id:'541', name:'Smart'}, {id:'561', name:'Passol'}, {id:'581', name:'Badhon'},
            {id:'601', name:'JFJ'}
        ];

        const state = {
            user: JSON.parse(localStorage.getItem('reb_user_v8')) || null,
            history: JSON.parse(localStorage.getItem('reb_history_cache')) || [],
            defaults: { 
                manufacturerId: '581', meterType: 'j-39', bodySeal1: 'LS', bodySeal2: 'LS', 
                initialReading: '0', kwhReading: '0', demandReading: '0',
                ctManufacturer: '0', ctSeal: '0' 
            }
        };

        // --- Polling Logic ---
        async function runTask(payload) {
            try {
                const res = await fetch(API_BASE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const initData = await res.json();
                if (initData.status === 'queued' && initData.trackingId) {
                    return await pollTaskStatus(initData.trackingId);
                }
                return initData;
            } catch (err) { throw err; }
        }

        async function pollTaskStatus(trackingId) {
            const url = `${STATUS_URL}${trackingId}`;
            while (true) {
                const res = await fetch(url);
                const task = await res.json();
                if (task.status === 'completed') return task.result;
                else if (task.status === 'failed') throw new Error(task.error || "Task failed");
                await new Promise(r => setTimeout(r, 2000));
            }
        }

        // --- Core Functions ---
        function setBtnLoading(btnId, isLoading, text = '') {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            if (isLoading) {
                btn.disabled = true;
                btn.dataset.originalText = btn.innerHTML;
                btn.innerHTML = `<span class="loader"></span> ${text}`;
                btn.classList.add('opacity-70', 'cursor-not-allowed');
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.dataset.originalText;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if(state.user) initApp();
            else document.getElementById('loginPage').classList.remove('hidden');
            loadSettings();
        });

        async function handleLogin(e) {
            e.preventDefault();
            const uid = document.getElementById('userIdInput').value;
            const pass = document.getElementById('passwordInput').value;
            const msg = document.getElementById('loginMsg');
            setBtnLoading('loginBtn', true, 'Checking...');
            msg.innerText = "";
            try {
                const result = await runTask({ action: 'check', userid: uid, password: pass });
                if(result && result.success) {
                    let userDisplay = result.userInfo.split('[')[0];
                    state.user = { userid: uid, password: pass, pbs: result.pbs, zonal: result.zonal, displayName: userDisplay };
                    localStorage.setItem('reb_user_v8', JSON.stringify(state.user));
                    initApp();
                } else { msg.innerText = "Login Failed!"; }
            } catch (err) { msg.innerText = "Error: System Busy"; }
            setBtnLoading('loginBtn', false);
        }

        function initApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('appLayout').classList.remove('hidden');
            document.getElementById('appLayout').classList.add('flex');
            document.getElementById('displayUserName').innerText = state.user.displayName;
            document.getElementById('displayOffice').innerText = state.user.zonal || state.user.pbs; 
            restoreDraft();
            if(state.history.length === 0) fetchHistory(300);
            else renderHistory();
        }

        async function fetchHistory(limit = 300) { 
            try { 
                const result = await runTask({ action: 'LIST', userid: state.user.userid, password: state.user.password, limit: limit });
                if(result && result.data) { updateHistoryCache(result.data); renderHistory(); } 
            } catch(e) { console.log("Fetch failed", e); } 
        }

        
async function startPostingOneByOne() {
    const rows = document.querySelectorAll('.meter-row');
    const queue = [];
    
    // ১. পোস্টিংয়ের জন্য ডাটা সংগ্রহ করা
    rows.forEach(row => {
        const meter = row.querySelector('.inp-meter').value.trim();
        const seal = row.querySelector('.inp-seal').value.trim();
        const statusCell = row.querySelector('.status-cell');
        
        if(meter && seal && !statusCell.classList.contains('text-green-500')) {
            const meterData = { 
                meterNo: meter, sealNo: seal, 
                manufacturerId: row.querySelector('.inp-brand').value,
                initialReading: row.querySelector('.inp-init').value, 
                kwhReading: row.querySelector('.inp-kwh').value,
                demandReading: row.querySelector('.inp-demand').value, 
                meterType: row.querySelector('.inp-type').value,
                bodySeal1: row.querySelector('.inp-bs1').value, 
                bodySeal2: row.querySelector('.inp-bs2').value,
                ctManufacturer: row.querySelector('.inp-ctManufacturer').value,
                ctSeal: row.querySelector('.inp-ctSeal').value
            };
            queue.push({ row, data: meterData });
        }
    });

    if(queue.length === 0) return alert("Nothing to post!");

    setBtnLoading('postBtn', true, 'Posting...');

    // ২. ধাপ ১: দ্রুত সব মিটার পোস্ট করা
    for (let i = 0; i < queue.length; i++) {
        const item = queue[i];
        const st = item.row.querySelector('.status-cell');
        st.innerHTML = '<span class="loader text-primary"></span> <span class="text-[10px] ml-1">Posting...</span>';
        st.className = "grid-cell status-cell text-primary font-bold";

        try {
            // শুধুমাত্র রিকোয়েস্ট পাঠানো হচ্ছে
            runTask({ 
                action: 'FAST', 
                userid: state.user.userid, 
                password: state.user.password, 
                meters: [item.data] 
            }); 
        } catch (err) { console.error("Post failed for", item.data.meterNo); }

        // সামান্য গ্যাপ রাখা যাতে সার্ভার জ্যাম না হয়
        if (i < queue.length - 1) await new Promise(r => setTimeout(r, 1500));
    }

    // ৩. ধাপ ২: সব পোস্ট শেষে হিস্ট্রি আপডেট করা (একবার)
    setBtnLoading('postBtn', true, 'Start Posting');
    await new Promise(r => setTimeout(r, 3000)); // সার্ভার প্রসেসিংয়ের জন্য ৩ সেকেন্ড অপেক্ষা
    await fetchHistory(queue.length + 10); // পোস্ট করা মিটারের সমপরিমাণ ডাটা রিফ্রেশ করা

    // ৪. ধাপ ৩: হিস্ট্রি ক্যাশ থেকে চেক করে স্ট্যাটাস আপডেট করা
    setBtnLoading('postBtn', true, 'Checking Status...');
    queue.forEach(item => {
        const st = item.row.querySelector('.status-cell');
        const meterNo = item.data.meterNo;
        
        // হিস্ট্রি ক্যাশে মিটারটি আছে কিনা চেক
        const found = state.history.find(m => m.meterNo === meterNo);

        if (found) {
            st.innerHTML = '<i class="fa-solid fa-check"></i> Done';
            st.className = "grid-cell status-cell text-green-500 font-bold";
        } else {
            st.innerHTML = '<i class="fa-solid fa-xmark"></i> Failed';
            st.className = "grid-cell status-cell text-red-500 font-bold";
        }
    });

    setBtnLoading('postBtn', false);
    saveDraft();
}

// আলাদা ফাংশন যা প্রতিটি মিটারের রেজাল্ট হ্যান্ডেল করবে
// মিটার ইনভেন্টরিতে যুক্ত হয়েছে কিনা তা চেক করার ফাংশন


// ১. ইনভেন্টরি বা হিস্ট্রিতে মিটারটি আছে কিনা তা চেক করার মূল ফাংশন
async function verifyMeterInHistory(meterNo) {
    // ধাপ ১: প্রথমে লোকাল ক্যাশ (History Page এর ডাটা) চেক করবে
    const localFound = state.history.find(m => m.meterNo === meterNo);
    if (localFound) {
        return true; // লোকাল হিস্ট্রিতে পাওয়া গেছে, তাই আর API কলের প্রয়োজন নেই
    }

    // ধাপ ২: যদি লোকাল ক্যাশে না থাকে, তবে সার্ভার থেকে আপডেট করবে (সর্বোচ্চ ৩ বার ট্রাই)
    for (let i = 0; i < 3; i++) {
        // প্রতিবার ১০০ বা তার বেশি ডাটা ফেচ করে চেক করবে
        const limit = 3 + (i * 5); 
        const latestList = await refreshHistory(limit);
        
        if (latestList) {
            const serverFound = latestList.find(m => m.meterNo === meterNo);
            if (serverFound) return true; 
        }
        
        // ২ সেকেন্ড অপেক্ষা করে আবার চেক (সার্ভার প্রসেসিং টাইমের জন্য)
        await new Promise(resolve => setTimeout(resolve, 2000));
    }
    return false;
}

// ২. মিটার ডেটা পাঠানোর মেইন ফাংশন
async function sendMeterData(item) {
    const st = item.row.querySelector('.status-cell');
    const meterNo = item.data.meterNo;
    
    // প্রথমে চেক করে নিবে মিটারটি অলরেডি ইনভেন্টরিতে আছে কিনা
    const alreadyExists = state.history.find(m => m.meterNo === meterNo);
    if (alreadyExists) {
        st.innerHTML = '<i class="fa-solid fa-check"></i> Done (Exist)';
        st.className = "grid-cell status-cell text-green-500 font-bold";
        return;
    }

    st.innerHTML = '<span class="loader text-primary"></span> <span class="text-[10px] ml-1">Posting...</span>';
    st.className = "grid-cell status-cell text-primary font-bold";
    
    try {
        // পোস্টিং রিকোয়েস্ট
        await runTask({ 
            action: 'FAST', 
            userid: state.user.userid, 
            password: state.user.password, 
            meters: [item.data] 
        });
        
        // ভেরিফিকেশন শুরু
        st.innerHTML = '<span class="loader text-yellow-500"></span> <span class="text-[10px] ml-1 text-yellow-500">Verifying...</span>';
        
        const isVerified = await verifyMeterInHistory(meterNo);

        if (isVerified) {
            st.innerHTML = '<i class="fa-solid fa-check"></i> Done';
            st.className = "grid-cell status-cell text-green-500 font-bold";
        } else {
            st.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Not Found';
            st.className = "grid-cell status-cell text-red-500 font-bold";
        }
    } catch (err) {
        st.innerText = "Error";
        st.className = "grid-cell status-cell text-red-500 font-bold";
    }
    saveDraft();
}

// ৩. হিস্ট্রি আপডেট ফাংশন (যা আপনার state.history কে রিফ্রেশ করবে)
async function refreshHistory(limit = 3) {
    try {
        const result = await runTask({ 
            action: 'LIST', 
            userid: state.user.userid, 
            password: state.user.password, 
            limit: limit 
        });
        if(result && result.data) {
            // নতুন ডাটা ক্যাশে যোগ করা এবং ডুপ্লিকেট রিমুভ করা
            state.history = [...result.data, ...state.history.filter(h => !result.data.find(n => n.meterNo === h.meterNo))].slice(0, 1000);
            localStorage.setItem('reb_history_cache', JSON.stringify(state.history));
            renderHistory(); // হিস্ট্রি পেজ আপডেট
            return result.data;
        }
    } catch(e) { console.error("Sync failed", e); }
    return null;
}










        // --- UI Helpers (Same as original) ---
        function updateHistoryCache(newData) {
            state.history = [...newData, ...state.history.filter(h => !newData.find(n => n.meterNo === h.meterNo))];
            localStorage.setItem('reb_history_cache', JSON.stringify(state.history));
        }

        function renderHistory() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const list = state.history.filter(i => (i.meterNo && i.meterNo.toLowerCase().includes(q)) || (i.seal && i.seal.toLowerCase().includes(q)));
            document.getElementById('historyCount').innerText = `${list.length} Rec`;
            document.getElementById('historyTableBody').innerHTML = list.map(i => {
                let statusColor = i.status === 'Free' ? 'bg-green-900 text-green-300' : (i.status === 'Booked' ? 'bg-red-900 text-red-300' : 'bg-blue-900 text-blue-300');
                return `<tr class="hover:bg-surface border-b border-border transition"><td class="p-2 align-middle"><div class="font-bold text-white text-sm">${i.meterNo}</div><div class="text-[10px] text-textDim leading-tight">${i.brand}। ${i.date || ''}</div></td><td class="p-2 text-center align-middle font-mono text-primary text-xs">${i.seal || '-'}</td><td class="p-2 text-center text-textDim font-bold text-xs align-middle">${i.cmo || '-'}</td><td class="p-2 text-center align-middle"><span class="px-1.5 py-0.5 rounded text-[9px] font-bold uppercase ${statusColor}">${i.status}</span></td></tr>`;
            }).join('');
        }

        function saveDraft() {
            const rows = [];
            document.querySelectorAll('.meter-row').forEach(row => {
                rows.push({
                    meterNo: row.querySelector('.inp-meter').value, sealNo: row.querySelector('.inp-seal').value,
                    manufacturerId: row.querySelector('.inp-brand').value, initialReading: row.querySelector('.inp-init').value,
                    kwhReading: row.querySelector('.inp-kwh').value, demandReading: row.querySelector('.inp-demand').value,
                    meterType: row.querySelector('.inp-type').value, bodySeal1: row.querySelector('.inp-bs1').value,
                    bodySeal2: row.querySelector('.inp-bs2').value, ctManufacturer: row.querySelector('.inp-ctManufacturer').value,
                    ctSeal: row.querySelector('.inp-ctSeal').value, statusHtml: row.querySelector('.status-cell').innerHTML,
                    isSuccess: row.querySelector('.status-cell').classList.contains('text-green-500')
                });
            });
            localStorage.setItem('reb_draft_rows', JSON.stringify(rows));
            const settings = {}; ['init','kwh','demand','type','bs1','bs2','ctManufacturer','ctSeal'].forEach(id => {
                const el = document.getElementById(`tog-${id}`);
                if(el) settings[id] = el.checked;
            });
            localStorage.setItem('reb_settings', JSON.stringify(settings));
        }
        
        function restoreDraft() {
            const savedRows = JSON.parse(localStorage.getItem('reb_draft_rows'));
            const container = document.getElementById('meterTable');
            const headers = Array.from(container.querySelectorAll('.grid-header'));
            container.innerHTML = ''; headers.forEach(h => container.appendChild(h));
            if(savedRows && savedRows.length > 0) { savedRows.forEach((d, i) => { const div = document.createElement('div'); div.className='meter-row'; div.style.display='contents'; div.innerHTML=createRowHtml(i+1, d); container.appendChild(div); }); } 
            else { renderRows(1); }
            updateColumns();
        }

        function createRowHtml(index, data = null) {
            const def = state.defaults;
            const getVal = (key, defaultVal) => (data && key in data) ? data[key] : defaultVal;
            const val = {
                meter: getVal('meterNo', ''), seal: getVal('sealNo', getNextSealSequence()),
                brand: getVal('manufacturerId', def.manufacturerId), init: getVal('initialReading', def.initialReading),
                kwh: getVal('kwhReading', def.kwhReading), demand: getVal('demandReading', def.demandReading),
                type: getVal('meterType', def.meterType), bs1: getVal('bodySeal1', def.bodySeal1),
                bs2: getVal('bodySeal2', def.bodySeal2), ctManufacturer: getVal('ctManufacturer', (def.ctManufacturer || '0')), 
                ctSeal: getVal('ctSeal', (def.ctSeal || '0')), status: (data && data.statusHtml) ? data.statusHtml : 'Pending',
                statusClass: (data && data.isSuccess) ? "text-green-500" : "text-textDim"
            };
            return `<div class="grid-cell text-textDim text-xs row-index">${index}</div><div class="grid-cell"><input class="sheet-input inp-meter" value="${val.meter}" placeholder="Meter No" oninput="saveDraft()" onkeydown="handleKey(event)"></div><div class="grid-cell"><input class="sheet-input inp-seal" value="${val.seal}" oninput="saveDraft()" onkeydown="handleKey(event)"></div><div class="grid-cell"><select class="sheet-input inp-brand cursor-pointer" onchange="updateGlobalDefault('manufacturerId', this.value)">${getBrandOptions(val.brand)}</select></div><div class="grid-cell opt-col opt-init col-hidden"><input class="sheet-input inp-init" value="${val.init}" oninput="saveDraft()"></div><div class="grid-cell opt-col opt-kwh col-hidden"><input class="sheet-input inp-kwh" value="${val.kwh}" oninput="saveDraft()"></div><div class="grid-cell opt-col opt-demand col-hidden"><input class="sheet-input inp-demand" value="${val.demand}" oninput="saveDraft()"></div><div class="grid-cell opt-col opt-type col-hidden"><input class="sheet-input inp-type" value="${val.type}" onchange="updateGlobalDefault('meterType', this.value)"></div><div class="grid-cell opt-col opt-bs1 col-hidden"><input class="sheet-input inp-bs1" value="${val.bs1}" onchange="updateGlobalDefault('bodySeal1', this.value)"></div><div class="grid-cell opt-col opt-bs2 col-hidden"><input class="sheet-input inp-bs2" value="${val.bs2}" onchange="updateGlobalDefault('bodySeal2', this.value)"></div><div class="grid-cell opt-col opt-ctManufacturer col-hidden"><input class="sheet-input inp-ctManufacturer" value="${val.ctManufacturer}" oninput="saveDraft()" onchange="updateGlobalDefault('ctManufacturer', this.value)"></div><div class="grid-cell opt-col opt-ctSeal col-hidden"><input class="sheet-input inp-ctSeal" value="${val.ctSeal}" oninput="saveDraft()" onchange="updateGlobalDefault('ctSeal', this.value)"></div><div class="grid-cell status-cell text-xs font-bold ${val.statusClass}">${val.status}</div><div class="grid-cell cursor-pointer text-red-400 hover:text-red-200" onclick="deleteRow(this)"><i class="fa-solid fa-trash"></i></div>`;
        }

        function getBrandOptions(selectedId) { return manufacturers.map(m => `<option value="${m.id}" ${m.id == selectedId ? 'selected' : ''}>${m.name}</option>`).join(''); }
        function renderRows(count) { const container = document.getElementById('meterTable'); for(let i=0; i<count; i++) { const div = document.createElement('div'); div.className='meter-row'; div.style.display='contents'; div.innerHTML=createRowHtml(container.querySelectorAll('.meter-row').length+1); container.appendChild(div); } updateColumns(); saveDraft(); }
        function addEmptyRow() { renderRows(1); }
        function deleteRow(btn) { btn.closest('.meter-row').remove(); reIndexRows(); saveDraft(); }
        function reIndexRows() { document.querySelectorAll('.meter-row .row-index').forEach((el, idx) => el.innerText = idx + 1); }
        function clearSuccessRows() { const rows = document.querySelectorAll('.meter-row'); rows.forEach(row => { if(row.querySelector('.status-cell').classList.contains('text-green-500')) row.remove(); }); reIndexRows(); saveDraft(); }
        function handleKey(e) { if(e.key === 'Enter') { e.preventDefault(); const row = e.target.closest('.meter-row'); const next = row.nextElementSibling; if(!next || !next.classList.contains('meter-row')) { addEmptyRow(); setTimeout(() => { if(row.nextElementSibling) row.nextElementSibling.querySelector('.inp-meter').focus(); }, 0); } else { next.querySelector('.inp-meter').focus(); } } }
        function switchTab(tab) { document.getElementById('view-dashboard').classList.toggle('hidden', tab!=='dashboard'); document.getElementById('view-history').classList.toggle('hidden', tab!=='history'); document.getElementById('tab-dashboard').className = (tab==='dashboard'?"px-3 py-1 rounded text-xs bg-bg text-primary font-bold shadow transition":"px-3 py-1 rounded text-xs text-textDim transition"); document.getElementById('tab-history').className = (tab==='history'?"px-3 py-1 rounded text-xs bg-bg text-primary font-bold shadow transition":"px-3 py-1 rounded text-xs text-textDim transition"); if(tab==='dashboard') document.getElementById('view-dashboard').classList.add('flex'); else renderHistory(); }
        function toggleHistorySettings() { document.getElementById('historySettingsModal').classList.toggle('hidden'); }
        function toggleSettingsModal() { document.getElementById('settingsModal').classList.toggle('hidden'); }
        async function manualSyncHistory() { setBtnLoading('syncBtn', true, 'Syncing'); await fetchHistory(parseInt(document.getElementById('syncLimitInput').value || 300)); setBtnLoading('syncBtn', false); document.getElementById('historySettingsModal').classList.add('hidden'); }
        function clearHistoryCache() { if(confirm("Clear history?")) { state.history = []; localStorage.removeItem('reb_history_cache'); renderHistory(); } }
        function getNextSealSequence() { const sealInputs = document.querySelectorAll('.inp-seal'); if(sealInputs.length === 0) return ''; const lastVal = sealInputs[sealInputs.length - 1].value.trim(); if(!lastVal) return ''; const match = lastVal.match(/(\d+)$/); if(match) { const nextNum = (parseInt(match[1], 10) + 1).toString().padStart(match[1].length, '0'); return lastVal.substring(0, match.index) + nextNum; } return lastVal; }
        function updateGlobalDefault(key, value) { state.defaults[key] = value; saveDraft(); }
        function loadSettings() { const settings = JSON.parse(localStorage.getItem('reb_settings')); if(settings) { for(const key in settings) { const el = document.getElementById(`tog-${key}`); if(el) el.checked = settings[key]; } updateColumns(); } }
        function updateColumns() { 
            const ids = ['init','kwh','demand','type','bs1','bs2','ctManufacturer','ctSeal']; let cnt = 0; 
            ids.forEach(id => { const el = document.getElementById(`tog-${id}`); if(el && el.checked) { cnt++; document.querySelectorAll(`.opt-${id}`).forEach(e => e.classList.remove('col-hidden')); } else { document.querySelectorAll(`.opt-${id}`).forEach(e => e.classList.add('col-hidden')); } }); 
            if(window.innerWidth < 768) document.getElementById('meterTable').style.gridTemplateColumns = `35px 1fr 1fr 1fr ${'100px '.repeat(cnt)} 80px 30px`;
            else document.getElementById('meterTable').style.gridTemplateColumns = `40px 1fr 1fr 1fr ${'1fr '.repeat(cnt)} 100px 30px`;
        }
        function toggleSheetModal() { document.getElementById('sheetModal').classList.remove('hidden'); document.getElementById('sheetPasteArea').focus(); }
        function processSheetData() { const raw = document.getElementById('sheetPasteArea').value.trim(); if(!raw) return; const lines = raw.split('\n'); lines.forEach(line => { const parts = line.split(/\t|,/).map(s => s.trim()); if(parts.length >= 1) { const container = document.getElementById('meterTable'); const div = document.createElement('div'); div.className='meter-row'; div.style.display='contents'; div.innerHTML=createRowHtml(container.querySelectorAll('.meter-row').length+1, { meterNo: parts[0], sealNo: parts[1] }); container.appendChild(div); } }); updateColumns(); saveDraft(); document.getElementById('sheetModal').classList.add('hidden'); document.getElementById('sheetPasteArea').value = ''; }
        function logout() { localStorage.removeItem('reb_user_v8'); location.reload(); }
        window.addEventListener('resize', updateColumns);
    </script>
